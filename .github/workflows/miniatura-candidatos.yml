name: Miniatura (candidatos)

# Temporal: genera imágenes base para la miniatura del piloto con Pollinations (gratis, sin clave) y las guarda en tmp-miniatura/ de esta rama.
on:
  push:
    branches: [claude/project-thread-su1p3u]
    paths: [tmp-miniatura/prompts.json]

permissions:
  contents: write

jobs:
  candidatos:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const prompts = JSON.parse(fs.readFileSync("tmp-miniatura/prompts.json","utf8"));
          for (const [i, p] of prompts.entries()) for (const seed of [11, 23, 37, 41]) {
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=1920&height=1080&model=flux&nologo=true&seed=${seed}`;
            for (let t = 0; t < 3; t++) {
              const r = await fetch(url).catch(e => ({ ok: false, status: String(e) }));
              if (r.ok && /image/.test(r.headers.get("content-type") || "")) { fs.writeFileSync(`tmp-miniatura/c${i + 1}-${seed}.jpg`, Buffer.from(await r.arrayBuffer())); console.log("ok", i + 1, seed); break; }
              console.log("fallo", i + 1, seed, r.status); await new Promise(z => setTimeout(z, 15000));
            }
          }'
      - name: Guardar
        run: |
          git config user.name "humano-bot"; git config user.email "humano-bot@users.noreply.github.com"
          git add tmp-miniatura/*.jpg && git commit -m "Candidatos de miniatura" && git push
