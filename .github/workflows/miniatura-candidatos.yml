name: Miniatura (candidatos)

# Temporal: genera imágenes base para la miniatura del piloto con Cloudflare Workers AI y las guarda en tmp-miniatura/ de esta rama.
on:
  push:
    branches: [claude/project-thread-su1p3u]
    paths: [tmp-miniatura/prompts.json]

permissions:
  contents: write

jobs:
  candidatos:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const base = JSON.parse(fs.readFileSync("content/estilo.json","utf8")).prompt_base;
          const prompts = JSON.parse(fs.readFileSync("tmp-miniatura/prompts.json","utf8"));
          for (const [i, p] of prompts.entries()) for (const k of [1, 2]) {
            const r = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT_ID}/ai/run/@cf/black-forest-labs/flux-1-schnell`, {
              method: "POST", headers: { Authorization: `Bearer ${process.env.CF_API_TOKEN}`, "Content-Type": "application/json" },
              body: JSON.stringify({ prompt: `${p}, ${base}`, steps: 8 }) });
            const j = await r.json().catch(() => ({}));
            if (!j.result?.image) { console.log(i, k, r.status, JSON.stringify(j.errors || j).slice(0, 300)); continue; }
            fs.writeFileSync(`tmp-miniatura/c${i + 1}-${k}.jpg`, Buffer.from(j.result.image, "base64"));
            console.log("ok", i + 1, k);
          }'
      - name: Guardar
        run: |
          git config user.name "humano-bot"; git config user.email "humano-bot@users.noreply.github.com"
          git add tmp-miniatura/*.jpg && git commit -m "Candidatos de miniatura" && git push
