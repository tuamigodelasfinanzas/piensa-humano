name: Publicar

# Cada día a las 08:00 UTC renderiza lo que content/calendario.json publica en los próximos 2 días (hora de Madrid): el vídeo del domingo
# queda listo el viernes. Crea la release v-<fecha>-<id> con video.mp4, miniatura.jpg, subtitulos.srt y la ficha de publicación
# (título, descripción con capítulos, etiquetas y pasos) como texto de la release, y avisa por Telegram si hay secrets TELEGRAM_*.
# La subida a YouTube es a mano (Make Core no admite archivos de más de 100 MB): unos 5 minutos siguiendo la ficha.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Opcional: renderizar las filas de estas fechas (YYYY-MM-DD, separadas por comas) aunque ya estén hechas"
        required: false
        default: ""
      preview:
        description: "Opcional: id de un vídeo para renderizarlo como vista previa (release preview-<id>; las imágenes que falten salen como fondos)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      PH_PRESET: medium
      PH_MAXRATE: ${{ vars.PH_MAXRATE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar
        run: |
          npm install --no-audit --no-fund
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q edge-tts numpy
          python3 tools/musica.py

      - name: Qué toca
        id: rows
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.preview }}" ]; then
            echo "rows=[{\"date\":\"preview\",\"video\":\"${{ inputs.preview }}\"}]" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # ya hecho = ya existe su release con el vídeo
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[] | select(.tag_name|startswith("v-")) | select(any(.assets[]; .name=="video.mp4")) | {key: (.tag_name[2:12] + "|" + .tag_name[13:]), value: 1}] | from_entries' > hechos.json
          echo "rows=$(node src/queue.mjs hechos.json "${{ inputs.date }}")" >> "$GITHUB_OUTPUT"

      - name: Renderizar
        run: |
          set -euo pipefail
          ROWS='${{ steps.rows.outputs.rows }}'
          echo "Toca: $ROWS"
          tg() { [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ] && curl -sS -o /dev/null -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                   --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$1" --data-urlencode "disable_web_page_preview=true" || true; }
          for row in $(echo "$ROWS" | jq -c '.[]'); do
            DATE=$(echo "$row" | jq -r .date); ID=$(echo "$row" | jq -r .video)
            DIR="out/$ID/img"; OUT="out/$DATE-$ID"; mkdir -p "$DIR"
            if [ "$DATE" = preview ]; then TAG="preview-$ID"; else TAG="v-$DATE-$ID"; fi
            gh release download "img-$ID" -D "$DIR" --skip-existing || true
            if [ "$DATE" = preview ]; then
              IMG_PROVIDER=placeholder node src/images.mjs "content/videos/$ID" "$DIR" | tail -1
            else
              node src/images.mjs "content/videos/$ID" "$DIR" 0 | tail -1
              if [ "$(jq -r .complete "$DIR/estado.json")" != "true" ]; then
                MSG="HUMANO: $ID ($DATE) no tiene todas sus imágenes ($(jq -r '"\(.have)/\(.total)"' "$DIR/estado.json")). Lanza el workflow Imágenes."
                tg "$MSG"; echo "::error::$MSG"; exit 1
              fi
            fi
            node src/render.mjs "content/videos/$ID" "$DIR" "$OUT"
            node src/thumb.mjs "content/videos/$ID" "$DIR" "$OUT/miniatura.jpg"
            URL="https://github.com/${{ github.repository }}/releases/download/$TAG"
            node src/meta.mjs "content/videos/$ID" "$OUT" "${DATE/preview/$(date +%F)}" "$URL" "$OUT/ficha.md"
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$DATE · $(jq -r .titulo content/videos/$ID/video.json)" --notes-file "$OUT/ficha.md" --prerelease
            gh release edit "$TAG" --notes-file "$OUT/ficha.md"
            gh release upload "$TAG" "$OUT/video.mp4" "$OUT/miniatura.jpg" "$OUT/subtitulos.srt" "$OUT/ficha.md" "$OUT/render.json" --clobber
            PAGE="https://github.com/${{ github.repository }}/releases/tag/$TAG"
            tg "HUMANO: listo para subir a YouTube → $(jq -r .titulo content/videos/$ID/video.json) ($DATE, $(jq -r '"\(.duration/60|floor) min"' "$OUT/render.json")). Ficha y archivos: $PAGE"
            echo "::notice::$TAG listo → $PAGE"
          done
